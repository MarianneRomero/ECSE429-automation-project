[pytest]
testpaths = test
pythonpath = test
# Each test's line already names its bug, so the short summary only lists
# failures, errors and unexpected passes. Use -ra to also list every XFAIL.
addopts = -rfEX
# Progress percentages would be appended to the per-test lines (see reporting.py).
console_output_style = classic
xfail_strict = true
markers =
    bug(id): the test demonstrates a bug or documentation mismatch from the exploratory sessions
